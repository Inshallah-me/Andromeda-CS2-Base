name: Build PluginSense

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install ATL (BlackBone dependency)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -property installationPath
          $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
          & $setup modify --installPath $installPath --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart
          if ($LASTEXITCODE -ne 0) { throw "ATL install failed with exit code $LASTEXITCODE" }

      - name: Build PluginSense (Release x64)
        run: msbuild PluginSense.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PluginSense
          path: |
            **/PluginSense.exe
            **/PluginSense.pdb

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/PluginSense.exe
            **/PluginSense.pdb
